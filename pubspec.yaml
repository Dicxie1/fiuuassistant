name: fiuuassistant
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  google_sign_in: ^7.2.0
  vibration: ^3.2.1
  sensors_plus: ^7.1.1
  flutter_contacts: ^2.6.0
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  flutter_riverpod: ^3.4.3
  flutter_sms: ^3.0.1
  geolocator: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/img/URACCAN_Logo.png
    - assets/img/cubes.png
    - assets/img/icon.png
    - assets/img/asfalt_dark.png
    - assets/audio/white_noise.mp3
    - assets/img/isolete_logo.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/img/isolete_logo.png"

flutter_native_splash:
  color: "#F5F7F7"
  image: assets/img/isolete_logo.png
  fullscreen: true

  android: true
  ios: true
  web: true
