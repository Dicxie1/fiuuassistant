name: fiuuassistant
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.5.1
  firebase_core: ^4.7.0
  firebase_storage: ^13.4.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  google_sign_in: ^7.2.0
  vibration: ^3.1.5
  sensors_plus: ^5.0.1
  flutter_contacts: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/img/URACCAN_Logo.png
    - assets/img/cubes.png
    - assets/img/icon.png
    - assets/img/asfalt_dark.png
    - assets/audio/white_noise.mp3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/img/icon.png
  fullscreen: true

  android: true
  ios: true
  web: true